name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [darwin, linux]
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -o ssmctl-${{ matrix.os }}-${{ matrix.arch }} ./cmd
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssmctl-${{ matrix.os }}-${{ matrix.arch }}
          path: ssmctl-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find binaries -type f -name "ssmctl-*" -exec mv {} release/ \;
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/ssmctl-*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Publish to GitHub Packages
        run: |
          go install github.com/${{ github.repository }}/cmd@${{ github.ref_name }}
        env:
          GOPROXY: direct
          GOSUMDB: off
